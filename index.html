<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Undertale-Fight-Squares</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden; 
            color: white;
            font-family: 'VT323', monospace;
        }

        canvas {
            display: block;
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Game State Variables
        let gameState = 'MENU'; 
        let menuSelection = 0;   
        let battleSelection = 0; 
        let actSelection = 0;    // 0 = Check, 1 = Doodle, 2 = Round Off
        let mercySelection = 0;  // 0 = Spare, 1 = Flee
        const globalFont = '"VT323", monospace';

        // Entity Stats
        let redSquareMaxHP = 3600;
        let redSquareHP = 3600;
        let playerMaxHP = 92;
        let playerHP = 92;

        // Pacifist / ACT Tracking
        let checkCount = 0;
        let pacifistProgress = 0;
        let canSpare = false;
        let currentBoxText = '';

        // Attack Bar Variables
        let attackBarX = 0;
        let attackBarSpeed = 12;
        let attackDamage = 0;
        let displayTimer = 0;
        let isPerfectHit = false;

        // Reset game state for a new run
        function resetBattle() {
            redSquareHP = redSquareMaxHP;
            playerHP = playerMaxHP;
            checkCount = 0;
            pacifistProgress = 0;
            canSpare = false;
            battleSelection = 0;
            actSelection = 0;
            mercySelection = 0;
        }

        // Input Handling
        window.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();

            // --- MENU STATE ---
            if (gameState === 'MENU') {
                if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright'].includes(key)) {
                    menuSelection = menuSelection === 0 ? 1 : 0;
                }
                if (key === 'z' || key === 'enter') {
                    if (menuSelection === 0) {
                        resetBattle();
                        gameState = 'BATTLE';
                    }
                    if (menuSelection === 1) gameState = 'KEYBINDS';
                }
            } 
            // --- KEYBINDS STATE ---
            else if (gameState === 'KEYBINDS') {
                if (key === 'x' || key === 'shift') gameState = 'MENU'; 
            } 
            // --- MAIN BATTLE MENU ---
            else if (gameState === 'BATTLE') {
                if (key === 'arrowleft') {
                    battleSelection = (battleSelection > 0) ? battleSelection - 1 : 3;
                }
                if (key === 'arrowright') {
                    battleSelection = (battleSelection < 3) ? battleSelection + 1 : 0;
                }
                if (key === 'z' || key === 'enter') {
                    if (battleSelection === 0) gameState = 'FIGHT_SELECT';
                    if (battleSelection === 1) gameState = 'ACT_SELECT';
                    if (battleSelection === 3) gameState = 'MERCY_SELECT';
                }
            }
            // --- FIGHT TARGET SELECT ---
            else if (gameState === 'FIGHT_SELECT') {
                if (key === 'x' || key === 'shift') gameState = 'BATTLE';
                if (key === 'z' || key === 'enter') {
                    gameState = 'ATTACKING';
                    attackBarX = (canvas.width / 2) - 270;
                }
            }
            // --- ATTACK MINIGAME ---
            else if (gameState === 'ATTACKING') {
                if (key === 'z' || key === 'enter') {
                    const cx = canvas.width / 2;
                    const distance = Math.abs(attackBarX - cx);
                    
                    if (distance <= 15) {
                        attackDamage = 180;
                        isPerfectHit = true;
                    } else if (distance <= 75) {
                        attackDamage = 90;
                        isPerfectHit = false;
                    } else if (distance <= 200) {
                        attackDamage = 20;
                        isPerfectHit = false;
                    } else {
                        attackDamage = 0;
                        isPerfectHit = false;
                    }

                    redSquareHP -= attackDamage;
                    if (redSquareHP < 0) redSquareHP = 0;

                    gameState = 'DAMAGE_DISPLAY';
                    displayTimer = 60;
                }
            }
            // --- ACT TARGET SELECT ---
            else if (gameState === 'ACT_SELECT') {
                if (key === 'x' || key === 'shift') gameState = 'BATTLE';
                if (key === 'z' || key === 'enter') {
                    gameState = 'ACT_OPTIONS';
                    actSelection = 0;
                }
            }
            // --- ACT OPTIONS MENU ---
            else if (gameState === 'ACT_OPTIONS') {
                if (key === 'x' || key === 'shift') gameState = 'ACT_SELECT';
                
                // True 2-Column Grid Navigation
                if (key === 'arrowright') {
                    if (actSelection === 0) actSelection = 1;
                } else if (key === 'arrowleft') {
                    if (actSelection === 1) actSelection = 0;
                } else if (key === 'arrowdown') {
                    if (actSelection === 0 || actSelection === 1) actSelection = 2;
                } else if (key === 'arrowup') {
                    if (actSelection === 2) actSelection = 0;
                }

                if (key === 'z' || key === 'enter') {
                    if (actSelection === 0) {
                        // CHECK
                        if (checkCount === 0) {
                            currentBoxText = '* RED SQUARE - 3600 HP 10 DEF\n* A perfectly balanced shape.';
                        } else {
                            currentBoxText = '* Red Square is obsessed with balance, angles, and perfection.\n* It views you as an asymmetrical anomaly that needs to be flattened.';
                        }
                        checkCount++;
                    } 
                    else if (actSelection === 1) {
                        // DOODLE
                        pacifistProgress++;
                        currentBoxText = '* You drew squiggly lines outside the grid.\n* Red Square looks disturbed by the sudden asymmetry!';
                    } 
                    else if (actSelection === 2) {
                        // ROUND OFF
                        pacifistProgress++;
                        currentBoxText = '* You attempted to sand down Red Square\'s sharp 90 degree corners.\n* Its sharp outline softened slightly!';
                    }

                    if (pacifistProgress >= 5) {
                        canSpare = true;
                    }

                    gameState = 'ACT_TEXT';
                }
            }
            // --- ACT TEXT DISPLAY ---
            else if (gameState === 'ACT_TEXT') {
                if (key === 'z' || key === 'enter') gameState = 'BATTLE';
            }
            // --- MERCY MENU ---
            else if (gameState === 'MERCY_SELECT') {
                if (key === 'x' || key === 'shift') gameState = 'BATTLE';

                if (key === 'arrowup' || key === 'arrowdown') {
                    mercySelection = mercySelection === 0 ? 1 : 0;
                }

                if (key === 'z' || key === 'enter') {
                    if (mercySelection === 0) {
                        // SPARE
                        if (canSpare) {
                            currentBoxText = '* YOU WON!\n* You earned 0 EXP and 0 gold.';
                            gameState = 'VICTORY';
                        } else {
                            currentBoxText = '* Red Square is not ready to accept your mercy yet.';
                            gameState = 'MERCY_TEXT';
                        }
                    } else if (mercySelection === 1) {
                        // FLEE
                        currentBoxText = '* Escaping is not an option.';
                        gameState = 'MERCY_TEXT';
                    }
                }
            }
            // --- MERCY TEXT DISPLAY ---
            else if (gameState === 'MERCY_TEXT') {
                if (key === 'z' || key === 'enter') gameState = 'BATTLE';
            }
            // --- VICTORY STATE ---
            else if (gameState === 'VICTORY') {
                if (key === 'z' || key === 'enter') gameState = 'MENU';
            }
        });

        // Logic Update Loop
        function update() {
            if (gameState === 'ATTACKING') {
                attackBarX += attackBarSpeed;
                const boxRightEdge = (canvas.width / 2) + 270;
                
                if (attackBarX > boxRightEdge) {
                    attackDamage = 0;
                    isPerfectHit = false;
                    gameState = 'DAMAGE_DISPLAY';
                    displayTimer = 60;
                }
            } else if (gameState === 'DAMAGE_DISPLAY') {
                displayTimer--;
                if (displayTimer <= 0) {
                    if (redSquareHP <= 0) {
                        currentBoxText = '* YOU WON!\n* You earned 50000 EXP and 0 gold.';
                        gameState = 'VICTORY';
                    } else {
                        gameState = 'BATTLE';
                    }
                }
            }
        }

        // Drawing Functions
        function drawMenu() {
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;

            ctx.fillStyle = '#FFFFFF';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            ctx.font = `60px ${globalFont}`;
            ctx.fillText('UNDERTALE: SQUARES', cx, cy - 150);

            const options = ['START', 'KEYBINDS'];
            const btnWidth = 200;
            const btnHeight = 60;
            const startY = cy - 20;
            const spacing = 90;

            for (let i = 0; i < options.length; i++) {
                const btnY = startY + (i * spacing);
                
                if (menuSelection === i) {
                    ctx.strokeStyle = '#FFFF00'; 
                    ctx.fillStyle = '#FFFF00';
                } else {
                    ctx.strokeStyle = '#FFFFFF';
                    ctx.fillStyle = '#FFFFFF';
                }

                ctx.lineWidth = 4;
                ctx.strokeRect(cx - (btnWidth / 2), btnY, btnWidth, btnHeight);
                
                ctx.font = `40px ${globalFont}`;
                ctx.fillText(options[i], cx, btnY + (btnHeight / 2) + 4); 
            }
        }

        function drawKeybinds() {
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;

            ctx.fillStyle = '#FFFFFF';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            ctx.font = `50px ${globalFont}`;
            ctx.fillText('CONTROLS', cx, cy - 100);

            ctx.font = `30px ${globalFont}`;
            ctx.fillText('ARROW KEYS = MOVE / NAVIGATE', cx, cy - 10);
            ctx.fillText('Z / ENTER = SELECT', cx, cy + 40);
            ctx.fillText('X / SHIFT = DESELECT / BACK', cx, cy + 90);

            ctx.fillStyle = '#888';
            ctx.font = `24px ${globalFont}`;
            ctx.fillText('(Press X or SHIFT to return)', cx, cy + 180);
        }

        function drawBattle() {
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;

            // Battle Box
            const boxWidth = 560;
            const boxHeight = 160;
            const boxX = cx - (boxWidth / 2);
            const boxY = cy - 20;

            ctx.strokeStyle = '#FFFFFF';
            ctx.lineWidth = 4;
            ctx.strokeRect(boxX, boxY, boxWidth, boxHeight);

            // Enemy Sprite
            const enemySize = 80;
            const enemyX = cx - (enemySize / 2);
            const enemyY = boxY - enemySize - 10;
            
            if (gameState !== 'VICTORY') {
                ctx.fillStyle = '#FF0000';
                ctx.fillRect(enemyX, enemyY, enemySize, enemySize);

                // Enemy HP Bar
                ctx.fillStyle = '#FF0000';
                ctx.fillRect(cx - 40, enemyY - 15, 80, 5);
                ctx.fillStyle = '#00FF00';
                ctx.fillRect(cx - 40, enemyY - 15, 80 * (redSquareHP / redSquareMaxHP), 5);
            }

            // Box Text & Sub-menu Rendering
            ctx.fillStyle = '#FFFFFF';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'top';
            ctx.font = `32px ${globalFont}`;

            if (gameState === 'BATTLE') {
                ctx.fillText('* Smells like a 90 degree angle.', boxX + 30, boxY + 30);
            } 
            else if (gameState === 'FIGHT_SELECT' || gameState === 'ACT_SELECT') {
                if (canSpare) ctx.fillStyle = '#FFFF00';
                else ctx.fillStyle = '#FFFFFF';
                
                ctx.fillText('* Red Square', boxX + 50, boxY + 30);
                
                ctx.fillStyle = '#FF0000';
                ctx.fillText('♥', boxX + 25, boxY + 30);
            }
            else if (gameState === 'ACT_OPTIONS') {
                const actOpts = ['* Check', '* Doodle', '* Round Off'];
                const positions = [
                    { x: boxX + 50, y: boxY + 30 },
                    { x: boxX + 280, y: boxY + 30 },
                    { x: boxX + 50, y: boxY + 80 }
                ];

                for (let i = 0; i < actOpts.length; i++) {
                    ctx.fillStyle = '#FFFFFF';
                    ctx.fillText(actOpts[i], positions[i].x, positions[i].y);
                    
                    if (actSelection === i) {
                        ctx.fillStyle = '#FF0000';
                        ctx.fillText('♥', positions[i].x - 25, positions[i].y);
                    }
                }
            }
            else if (gameState === 'ACT_TEXT' || gameState === 'MERCY_TEXT' || gameState === 'VICTORY') {
                const lines = currentBoxText.split('\n');
                for (let i = 0; i < lines.length; i++) {
                    ctx.fillText(lines[i], boxX + 30, boxY + 30 + (i * 40));
                }
            }
            else if (gameState === 'MERCY_SELECT') {
                if (canSpare) ctx.fillStyle = '#FFFF00';
                else ctx.fillStyle = '#FFFFFF';
                ctx.fillText('* Spare', boxX + 50, boxY + 30);

                ctx.fillStyle = '#FFFFFF';
                ctx.fillText('* Flee', boxX + 50, boxY + 80);

                ctx.fillStyle = '#FF0000';
                const heartY = (mercySelection === 0) ? boxY + 30 : boxY + 80;
                ctx.fillText('♥', boxX + 25, heartY);
            }
            else if (gameState === 'ATTACKING' || gameState === 'DAMAGE_DISPLAY') {
                // Target Reticle
                ctx.strokeStyle = '#FFFFFF';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.ellipse(cx, boxY + (boxHeight / 2), boxWidth / 2 - 20, boxHeight / 2 - 20, 0, 0, 2 * Math.PI);
                ctx.stroke();

                // Target Line
                ctx.fillStyle = '#00FF00';
                ctx.fillRect(cx - 2, boxY + 10, 4, boxHeight - 20);

                // Moving Attack Bar
                ctx.fillStyle = '#FFFFFF';
                if (gameState === 'DAMAGE_DISPLAY') {
                    if (isPerfectHit && displayTimer % 10 > 5) ctx.fillStyle = '#FFFF00'; 
                    else if (displayTimer % 10 > 5) ctx.fillStyle = '#888888'; 
                }
                ctx.fillRect(attackBarX - 4, boxY + 5, 8, boxHeight - 10);

                // Damage Numbers
                if (gameState === 'DAMAGE_DISPLAY') {
                    ctx.textAlign = 'center';
                    ctx.font = `40px ${globalFont}`;
                    if (attackDamage === 0) {
                        ctx.fillStyle = '#AAAAAA';
                        ctx.fillText('MISS', cx, enemyY - 30 - (60 - displayTimer) * 0.5);
                    } else {
                        ctx.fillStyle = '#FF0000';
                        ctx.fillText(attackDamage, cx, enemyY - 30 - (60 - displayTimer) * 0.5);
                    }
                }
            }

            // HUD / Player Stats Bar
            const hudY = boxY + boxHeight + 20;
            
            ctx.fillStyle = '#FFFFFF';
            ctx.textAlign = 'left';
            ctx.font = `24px ${globalFont}`;
            ctx.fillText('PLAYER   LV 19   HP', boxX, hudY);

            // HP Bar (Red BG)
            const hpBarX = boxX + 205;
            const hpBarWidth = 40; 
            ctx.fillStyle = '#FF0000';
            ctx.fillRect(hpBarX, hudY + 5, hpBarWidth, 20);

            // HP Bar (Yellow FG)
            ctx.fillStyle = '#FFFF00';
            const currentHpWidth = hpBarWidth * (playerHP / playerMaxHP);
            ctx.fillRect(hpBarX, hudY + 5, currentHpWidth, 20);

            // HP Text
            ctx.fillStyle = '#FFFFFF';
            ctx.fillText(`${playerHP} / ${playerMaxHP}`, hpBarX + hpBarWidth + 15, hudY);

            // Action Buttons
            const buttons = ['FIGHT', 'ACT', 'ITEM', 'MERCY'];
            const btnY = hudY + 45;
            const btnW = 120;
            const btnH = 45;
            const totalSpacing = 20; 
            const totalWidth = (btnW * 4) + (totalSpacing * 3);
            const startX = cx - (totalWidth / 2);

            ctx.lineWidth = 3;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            for (let i = 0; i < buttons.length; i++) {
                const x = startX + (i * (btnW + totalSpacing));
                
                // Highlight active action button
                if (battleSelection === i && ['BATTLE', 'FIGHT_SELECT', 'ACT_SELECT', 'ACT_OPTIONS', 'MERCY_SELECT'].includes(gameState)) {
                    ctx.strokeStyle = '#FFFF00'; 
                    ctx.fillStyle = '#FFFF00';   
                } else {
                    ctx.strokeStyle = '#FF8C00'; 
                    ctx.fillStyle = '#FF8C00';   
                }

                ctx.strokeRect(x, btnY, btnW, btnH);
                ctx.fillText(buttons[i], x + (btnW / 2), btnY + (btnH / 2) + 2);
            }
        }

        function gameLoop() {
            update();

            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (gameState === 'MENU') {
                drawMenu();
            } else if (gameState === 'KEYBINDS') {
                drawKeybinds();
            } else {
                drawBattle();
            }

            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
